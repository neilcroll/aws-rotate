name: Build and Test

on:
  push:
    branches: [ main, dev, v2 ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev, v2 ]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  build-cli:
    name: Build CLI
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: aws-rotate-cli-linux-amd64
            binary_name: aws-rotate-cli
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: aws-rotate-cli-linux-arm64
            binary_name: aws-rotate-cli
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: aws-rotate-cli-darwin-amd64
            binary_name: aws-rotate-cli
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: aws-rotate-cli-darwin-arm64
            binary_name: aws-rotate-cli
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: aws-rotate-cli-windows-amd64
            binary_name: aws-rotate-cli.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        working-directory: cmd/cli
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../../${{ matrix.binary_name }}

      - name: Rename binary for artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv ${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}.exe
          else
            mv ${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 30

  release:
    name: Create Release
    needs: build-cli
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Create compressed archives for each platform
          cd artifacts
          for dir in */; do
            platform=$(basename "$dir")
            cd "$dir"
            if [[ "$platform" == *"windows"* ]]; then
              zip -r "../../release/${platform}.zip" *
            else
              tar -czf "../../release/${platform}.tar.gz" *
              # Make binaries executable in tar
              chmod +x *
            fi
            cd ..
          done

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## AWS Multi-Account Credentials Rotator ${{ github.ref_name }}

            **Note:** This release contains the CLI version. For the desktop GUI (Wails), build from source using `wails build`.

            ### Downloads
            Choose the appropriate CLI binary for your platform:

            - **Linux AMD64**: `aws-rotate-cli-linux-amd64.tar.gz`
            - **Linux ARM64**: `aws-rotate-cli-linux-arm64.tar.gz`
            - **macOS Intel**: `aws-rotate-cli-darwin-amd64.tar.gz`
            - **macOS Apple Silicon**: `aws-rotate-cli-darwin-arm64.tar.gz`
            - **Windows**: `aws-rotate-cli-windows-amd64.zip`

            ### Installation
            
            **Linux/macOS:**
            ```bash
            # Extract the archive
            tar -xzf aws-rotate-cli-*.tar.gz
            
            # Make executable (if needed)
            chmod +x aws-rotate-cli-*
            
            # Move to PATH (optional)
            sudo mv aws-rotate-cli-* /usr/local/bin/aws-rotate
            ```

            **Windows:**
            1. Extract the ZIP file
            2. Add the executable to your PATH or run directly

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

